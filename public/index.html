<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal Shetkari</title>
<meta name="description" content="Royal Shetkari: authentic Maharashtrian food. Staff login for the restaurant POS.">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0a0a; --panel: #141414; --text: #f5f5f5; --muted: #a3a3a3; --gold: #d4af37; --line: #262626; }
  @media (prefers-color-scheme: light) {
    :root { --bg: #fafafa; --panel: #ffffff; --text: #111111; --muted: #5f5f5f; --gold: #a8842f; --line: #e5e5e5; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: var(--bg); color: var(--text); font-family: 'Outfit', sans-serif; padding: 24px 16px; }
  .card { width: 100%; max-width: 460px; text-align: center; background: var(--panel);
          border: 1px solid var(--line); padding: 48px 32px; }
  .mark { width: 34px; height: 34px; margin: 0 auto 18px; transform: rotate(45deg);
          border: 2px solid var(--gold); background: linear-gradient(135deg, var(--gold) 50%, transparent 50%); }
  h1 { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 2.4rem; margin: 0 0 8px; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 28px; }
  .btn { display: inline-block; padding: 14px 28px; background: var(--gold); color: #111; text-decoration: none;
         font-weight: 600; letter-spacing: 2px; text-transform: uppercase; font-size: .8rem; }
  .btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .wa { display: block; margin-top: 22px; color: var(--muted); font-size: .85rem; }
  .wa a { color: var(--gold); }
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true"></div>
    <h1>Royal Shetkari</h1>
    <p>Authentic Maharashtrian taste.<br>Restaurant point of sale for our staff.</p>
    <a class="btn" href="/login/">Staff Login</a>
    <span class="wa">Questions? WhatsApp us: <a href="https://wa.me/919172353945" target="_blank" rel="noopener">+91 91723 53945</a></span>
  </main>
</body>
</html>
